name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
      - run: npm ci
      - run: npx vue-cli-service lint --no-fix
      - run: npm test
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
