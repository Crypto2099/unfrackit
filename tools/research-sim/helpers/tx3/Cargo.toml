[package]
name = "tx3-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
resolver = "3"
publish = false
license = "Apache-2.0"

[[bin]]
name = "tx3-helper"
path = "src/main.rs"

[dependencies]
tx3-resolver = "=0.25.0"
tx3-cardano = "=0.25.0"
tx3-lang = "=0.25.0"
tx3-tir = "=0.19.0"
pallas = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
pollster = "0.4"

[profile.release]
debug = false
